name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  astro:
    name: Check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Usa `npm ci` cuando exista package-lock.json; si no, `npm install`.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
